name: Build and Push Non-Production Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
    
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./infra/ecr
        run: terraform init -input=false

      - name: Terraform Plan
        working-directory: ./infra/ecr
        run: terraform plan -input=false -var-file=variables.tfvars -out=tfplan

      - name: Terraform Apply
        working-directory: ./infra/ecr
        run: terraform apply -input=false -auto-approve tfplan
  
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::948935483157:role/GitHubActionsECRPushRole
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./app/backend
          push: true
          tags: 948935483157.dkr.ecr.ap-south-1.amazonaws.com/starburst-non-prod-backend:${{ github.sha }}-${{ github.run_attempt }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./app/frontend
          push: true
          tags: 948935483157.dkr.ecr.ap-south-1.amazonaws.com/starburst-non-prod-frontend:${{ github.sha }}-${{ github.run_attempt }}
